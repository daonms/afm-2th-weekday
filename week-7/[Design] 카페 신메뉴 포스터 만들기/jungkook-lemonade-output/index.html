<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프리미엄 자몽에이드 포스터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Pretendard:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --citrus: #ffb36b;
      --citrus-deep: #f26c4f;
      --cream-white: #fff8ef;
      --ink: #15110e;
      --font-display: "Black Han Sans", "Pretendard", system-ui, sans-serif;
      --font-body: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(242, 108, 79, 0.18), transparent 34%),
        radial-gradient(circle at bottom right, rgba(255, 179, 107, 0.18), transparent 30%),
        linear-gradient(160deg, #fffdf8 0%, #fff4e5 48%, #f6eee1 100%);
      padding: 24px;
      font-family: var(--font-body);
      color: var(--ink);
    }
    .poster {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.16)),
        var(--cream-white);
      color: var(--ink);
      box-shadow: 0 30px 88px rgba(72, 44, 18, .18);
      border: 1px solid rgba(21, 17, 14, 0.08);
    }
    .photo {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(94deg, rgba(255, 248, 239, 0.98) 0 31%, rgba(255, 248, 239, 0.74) 45%, rgba(255, 248, 239, 0.18) 67%, rgba(255, 248, 239, 0.08) 100%),
        linear-gradient(0deg, rgba(242, 108, 79, 0.06) 0%, rgba(255, 255, 255, 0.06) 50%, rgba(255, 179, 107, 0.12) 100%);
    }
    .photo img {
      position: absolute;
      right: -70px;
      bottom: -8px;
      width: 1000px;
      height: auto;
      opacity: 0.98;
      filter: saturate(1.08) contrast(1.04);
    }
    .content {
      position: relative;
      z-index: 3;
      height: 100%;
      padding: 70px;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    .eyebrow {
      margin: 0;
      width: max-content;
      padding: 11px 18px;
      border: 2px solid rgba(21, 17, 14, 0.86);
      font-weight: 900;
      font-size: 17px;
      letter-spacing: 0.06em;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.58);
    }
    h1 {
      margin: 22px 0 0;
      font-family: var(--font-display);
      font-size: 142px;
      line-height: .88;
      color: var(--ink);
      text-shadow: 0 8px 22px rgba(255, 255, 255, 0.4);
    }
    h1 .gold { color: var(--citrus-deep); }
    .menu-name {
      margin: 22px 0 0;
      width: max-content;
      padding: 12px 16px;
      background: var(--citrus-deep);
      color: var(--cream-white);
      font-size: 29px;
      font-weight: 900;
      line-height: 1;
    }
    .bottom {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: end;
    }
    .info {
      margin: 0;
      max-width: 600px;
      padding: 22px 24px;
      background: rgba(255, 255, 255, 0.7);
      border: 2px solid rgba(242, 108, 79, 0.22);
      backdrop-filter: blur(3px);
    }
    .desc {
      margin: 0 0 9px;
      font-size: 22px;
      line-height: 1.35;
      font-weight: 800;
      word-break: keep-all;
    }
    .meta {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
      font-weight: 700;
      color: rgba(21, 17, 14, 0.72);
      word-break: keep-all;
    }
    .price {
      width: 224px;
      height: 224px;
      border-radius: 50%;
      border: 10px solid var(--citrus);
      background: rgba(255, 255, 255, 0.92);
      display: grid;
      place-items: center;
      text-align: center;
      transform: rotate(5deg);
    }
    .price span {
      display: block;
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 9px;
      letter-spacing: 0.08em;
      color: var(--citrus-deep);
    }
    .price strong {
      display: block;
      font-size: 48px;
      line-height: .95;
      font-weight: 950;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    @media (max-width: 1120px) {
      body { padding: 0; background: #f8f1e8; }
      .poster { width: 100vw; height: calc(100vw * 1.25); box-shadow: none; }
      h1 { font-size: 14vw; }
      .photo img { width: 95vw; right: -6vw; }
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="프리미엄 자몽에이드 포스터">
    <div class="photo">
      <img src="./assets/premium-grapefruit-ade-gpt-image2.png" alt="프리미엄 자몽에이드 실사풍 이미지" />
    </div>
    <section class="content">
      <div>
        <p class="eyebrow">SUMMER LIMITED</p>
        <h1>상큼하게,<br><span class="gold">자몽 한 잔.</span></h1>
        <p class="menu-name">프리미엄 자몽에이드</p>
      </div>
      <div></div>
      <div class="bottom">
        <div class="info">
          <p class="desc">자몽 과육과 차가운 탄산이 살아 있는 여름 한정 시그니처</p>
          <p class="meta">7.1 - 7.31 · ICE ONLY · 하루 40잔</p>
        </div>
        <div class="price" aria-label="가격 7,200원">
          <div>
            <span>NEW MENU</span>
            <strong>7,200</strong>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
