<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>골든 레몬에이드 포스터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Pretendard:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --lemon-gold: #FFD84D;
      --black: #111111;
      --cream-white: #FFF8E8;
      --font-display: "Black Han Sans", "Pretendard", system-ui, sans-serif;
      --font-body: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0b0b;
      padding: 24px;
      font-family: var(--font-body);
    }
    .poster {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background: #0f0f0f;
      color: var(--cream-white);
      box-shadow: 0 30px 88px rgba(0,0,0,.42);
    }
    .photo {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 80% 18%, rgba(255,216,77,0.45) 0 22%, rgba(255,216,77,0) 48%),
        linear-gradient(140deg, rgba(17,17,17,0.86) 0 40%, rgba(17,17,17,0.28) 68%, rgba(17,17,17,0.56) 100%);
      z-index: 1;
    }
    .photo img {
      position: absolute;
      right: -100px;
      bottom: -10px;
      width: 1040px;
      height: auto;
      opacity: 0.92;
      filter: hue-rotate(64deg) saturate(1.55) brightness(1.08) contrast(1.15);
    }
    .silhouette {
      position: absolute;
      left: 560px;
      bottom: 180px;
      width: 270px;
      height: 510px;
      background: linear-gradient(180deg, rgba(255,216,77,0.52), rgba(17,17,17,0.92) 60%);
      clip-path: polygon(45% 0, 66% 8%, 74% 20%, 70% 31%, 64% 40%, 66% 54%, 78% 68%, 86% 87%, 66% 100%, 34% 100%, 16% 87%, 24% 68%, 34% 54%, 36% 40%, 30% 31%, 26% 20%, 34% 8%);
      opacity: 0.55;
      transform: rotate(-7deg);
      z-index: 2;
    }
    .content {
      position: relative;
      z-index: 3;
      height: 100%;
      padding: 70px;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    .eyebrow {
      margin: 0;
      width: max-content;
      padding: 11px 18px;
      border: 2px solid var(--lemon-gold);
      border-radius: 999px;
      font-weight: 900;
      font-size: 17px;
      letter-spacing: 0.06em;
      color: var(--lemon-gold);
      background: rgba(17,17,17,0.5);
    }
    h1 {
      margin: 22px 0 0;
      font-family: var(--font-display);
      font-size: 142px;
      line-height: .88;
      color: var(--cream-white);
      text-shadow: 0 8px 26px rgba(0,0,0,.42);
    }
    h1 .gold { color: var(--lemon-gold); }
    .menu-name {
      margin: 22px 0 0;
      width: max-content;
      padding: 12px 16px;
      background: var(--lemon-gold);
      color: var(--black);
      font-size: 29px;
      font-weight: 900;
      line-height: 1;
    }
    .bottom {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: end;
    }
    .info {
      margin: 0;
      max-width: 600px;
      padding: 22px 24px;
      background: rgba(17,17,17,0.55);
      border: 2px solid rgba(255,216,77,0.55);
      backdrop-filter: blur(3px);
    }
    .desc {
      margin: 0 0 9px;
      font-size: 22px;
      line-height: 1.35;
      font-weight: 800;
      word-break: keep-all;
    }
    .meta {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
      font-weight: 700;
      color: rgba(255,248,232,0.92);
      word-break: keep-all;
    }
    .price {
      width: 224px;
      height: 224px;
      border-radius: 999px;
      border: 10px solid var(--lemon-gold);
      background: rgba(17,17,17,0.86);
      display: grid;
      place-items: center;
      text-align: center;
      transform: rotate(5deg);
    }
    .price span {
      display: block;
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 9px;
      letter-spacing: 0.08em;
      color: var(--lemon-gold);
    }
    .price strong {
      display: block;
      font-size: 48px;
      line-height: .95;
      font-weight: 950;
      color: var(--cream-white);
      font-variant-numeric: tabular-nums;
    }
    @media (max-width: 1120px) {
      body { padding: 0; background: #111; }
      .poster { width: 100vw; height: calc(100vw * 1.25); box-shadow: none; }
      h1 { font-size: 14vw; }
      .photo img { width: 95vw; right: -6vw; }
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="골든 레몬에이드 포스터">
    <div class="photo">
      <img src="./assets/golden-lemonade-kpop-realistic.png" alt="골든 레몬에이드 실사풍 이미지" />
      <div class="silhouette" aria-hidden="true"></div>
    </div>
    <section class="content">
      <div>
        <p class="eyebrow">SUMMER LIMITED</p>
        <h1>마시는 순간,<br><span class="gold">골든.</span></h1>
        <p class="menu-name">골든 레몬에이드</p>
      </div>
      <div></div>
      <div class="bottom">
        <div class="info">
          <p class="desc">레몬청과 탄산, 꿀 시럽을 더한 청량한 여름 한정 에이드</p>
          <p class="meta">6.1 - 6.30 · 6,900원 · 하루 50잔</p>
        </div>
        <div class="price" aria-label="가격 6,900원">
          <div>
            <span>NEW MENU</span>
            <strong>6,900</strong>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
