<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이희석 명함 시안</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #e6e8eb;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Noto Sans KR", system-ui, sans-serif;
      color: #111111;
    }

    .wrap {
      width: 2320px;
      margin: 0 auto;
      padding: 72px 80px 88px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 44px;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0 0 40px;
      font-size: 24px;
      color: rgba(29, 27, 24, 0.74);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1050px);
      gap: 40px;
      align-items: start;
    }

    .item {
      display: grid;
      gap: 12px;
    }

    .label {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(29, 27, 24, 0.54);
    }

    iframe {
      width: 1050px;
      height: 630px;
      border: 0;
      background: transparent;
      box-shadow: 0 24px 48px rgba(25, 23, 21, 0.14);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Lee Hee Seuk Business Card Design</h1>
    <p>DAON 레퍼런스 기반 · 흑백 구조 + 붓글씨 무드 + QR 뒷면</p>
    <div class="grid">
      <div class="item">
        <div class="label">Front</div>
        <iframe src="business-card-front.html" title="front"></iframe>
      </div>
      <div class="item">
        <div class="label">Back</div>
        <iframe src="business-card-back.html" title="back"></iframe>
      </div>
    </div>
  </div>
</body>
</html>
